name: Finalize Proven Test Manifest

on:
  push:
    branches:
      - chore/project-consolidation-v1
    paths:
      - '.github/workflows/manifest-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: finalize-proven-test-manifest
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: chore/project-consolidation-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the previously proven reconciliation
        run: python3 scripts/reconcile-test-manifest.py

      - name: Validate arithmetic, governance, and whitespace
        run: |
          python3 scripts/check-project-governance.py
          git diff --check

      - name: Commit only the manifest and remove the temporary script
        shell: bash
        run: |
          # Permanent workflow changes are installed separately through the
          # connected GitHub integration, which has workflow-file authority.
          git restore .github/workflows/tests.yml .github/workflows/tests-extended.yml
          rm scripts/reconcile-test-manifest.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reconcile-test-manifest.py tests/test-manifest.json
          git diff --cached --check
          git commit -m "test: reconcile authoritative manifest counts"
          git push origin HEAD:chore/project-consolidation-v1
