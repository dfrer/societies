name: Weekly Full Validation

# Full core, Godot, coverage, and extended characterization tests.
# NOT part of the default PR gate. Triggered manually or at the end of the week.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Optional dotnet test --filter expression'
        required: false
        type: string
        default: ''
  schedule:
    # Friday evening in Vancouver (Saturday at 02:00 UTC).
    - cron: '0 2 * * 6'

jobs:
  run-core-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project governance
        run: python3 scripts/check-project-governance.py

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-full-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Godot .NET 4.6.2
        run: |
          wget -q -O godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_linux_x86_64.zip
          unzip -q godot.zip -d godot-bin
          GODOT_BIN=$(find godot-bin -type f -name 'Godot_v*_mono_linux.*' -print -quit)
          if [[ -z "$GODOT_BIN" ]]; then
            echo "::error::Godot Mono Linux executable was not found in the release archive."
            exit 1
          fi
          file "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$PWD/$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Restore dependencies
        run: dotnet restore tests/Societies.Core.Tests/Societies.Core.Tests.csproj

      - name: Build authoritative Godot project
        run: dotnet build src/societies/Societies.csproj --configuration Release --no-restore

      - name: Run all unit tests with coverage
        shell: pwsh
        run: |
          $manifest = Get-Content tests/test-manifest.json -Raw | ConvertFrom-Json
          dotnet test tests/Societies.Core.Tests/Societies.Core.Tests.csproj `
            --configuration Release `
            --logger "trx;LogFileName=unit-tests.trx" `
            --collect:"XPlat Code Coverage"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $trxPath = "tests/Societies.Core.Tests/TestResults/unit-tests.trx"
          [xml]$trx = Get-Content $trxPath -Raw
          $counters = $trx.SelectSingleNode("/*[local-name()='TestRun']/*[local-name()='ResultSummary']/*[local-name()='Counters']")
          if ($null -eq $counters) {
            Write-Error "TRX counters were not found at $trxPath"
            exit 1
          }

          $actualCount = [int]$counters.GetAttribute("total")
          $expectedCount = [int]$manifest.required.dotnet.expectedTestCount
          if ($actualCount -ne $expectedCount) {
            Write-Error "Full-test manifest drift: expected $expectedCount, discovered $actualCount."
            exit 1
          }

          Write-Host "Full-test manifest count verified: $actualCount"

      - name: Build Godot C# solutions
        run: godot --headless --path src/societies --build-solutions --quit

      - name: Run headless smoke suite
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path src/societies res://tests/HeadlessTestRunner.tscn 2>&1 | tee "$log_file"

          expected_count="$(python3 -c 'import json; print(json.load(open("tests/test-manifest.json", encoding="utf-8"))["required"]["godot"]["expectedTestCount"])')"
          result_line="$(grep -E 'Headless results: [0-9]+ passed, [0-9]+ failed' "$log_file" | tail -n 1 || true)"
          if [[ -z "$result_line" ]]; then
            echo "::error::Godot headless result summary was not found."
            exit 1
          fi

          actual_passed="$(sed -E 's/.*Headless results: ([0-9]+) passed, ([0-9]+) failed.*/\1/' <<< "$result_line")"
          actual_failed="$(sed -E 's/.*Headless results: ([0-9]+) passed, ([0-9]+) failed.*/\2/' <<< "$result_line")"
          if [[ "$actual_failed" -ne 0 || "$actual_passed" -ne "$expected_count" ]]; then
            echo "::error::Godot manifest drift or failure: expected $expected_count passed and 0 failed; observed $actual_passed passed and $actual_failed failed."
            exit 1
          fi

          echo "Godot manifest count verified: $actual_passed"

      - name: Generate core test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Core Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success() || failure()
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false
          verbose: true

  run-extended-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project governance
        run: python3 scripts/check-project-governance.py

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-extended-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build extended test project
        run: dotnet build tests/Societies.Core.Tests.Extended/Societies.Core.Tests.Extended.csproj --configuration Release

      - name: Run extended tests
        if: inputs.filter == null || inputs.filter == ''
        run: >
          dotnet test tests/Societies.Core.Tests.Extended/Societies.Core.Tests.Extended.csproj
          --configuration Release
          --logger "trx;LogFileName=extended-tests.trx"
          --logger "console;verbosity=detailed"
          --no-build

      - name: Run extended tests (custom filter)
        if: inputs.filter != null && inputs.filter != ''
        run: >
          dotnet test tests/Societies.Core.Tests.Extended/Societies.Core.Tests.Extended.csproj
          --configuration Release
          --logger "trx;LogFileName=extended-tests.trx"
          --logger "console;verbosity=detailed"
          --no-build
          --filter "${{ inputs.filter }}"

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Extended Test Results
          path: '**/TestResults/*extended*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload extended test artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: extended-test-reports
          path: |
            **/TestResults/*.trx
            **/starvation-report.md
            **/characterization-output.csv
            **/path-logistics-impact-report.md
          retention-days: 30
